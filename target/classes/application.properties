spring.application.name=PortableMessengerApp
server.port=8080
trace=false
# JPA settings
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:6965/postgres
spring.datasource.username=postgres
spring.datasource.password=asoradium
spring.jpa.generate-ddl=false
# Kafka settings
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.soradium.kafkalistenerexample
spring.kafka.producer.properties.spring.json.add.type.headers=false